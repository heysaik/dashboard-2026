name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Contribution policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/check-contribution.cjs --ci

  core:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test Tests/*.test.cjs
      - run: git diff --check

  macos:
    name: macOS build, native tests, and secrets
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install build and scan tools
        run: brew install xcodegen gitleaks
      - name: Scan Git history
        run: gitleaks git --redact --log-opts=--all .
      - name: Build and run isolated native tests
        run: ./scripts/test.sh
      - name: Verify universal binary
        run: lipo 'build/Build/Products/Release/Dashboard 2026.app/Contents/MacOS/Dashboard 2026' -verify_arch arm64 x86_64
      - name: Package and verify download checksum
        run: |
          DEVELOPER_ID_APPLICATION='' NOTARY_PROFILE='' ./scripts/package.sh
          cd dist
          shasum -a 256 -c Dashboard.zip.sha256
