name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test Tests/*.test.cjs
      - run: git diff --check

  macos:
    name: macOS build, native tests, and secrets
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install build and scan tools
        run: brew install xcodegen gitleaks
      - name: Scan Git history
        run: gitleaks git --redact --log-opts=--all .
      - name: Build and run isolated native tests
        run: ./scripts/test.sh
      - name: Verify universal binary
        run: lipo -verify_arch arm64 x86_64 'build/Build/Products/Release/Dashboard 2026.app/Contents/MacOS/Dashboard 2026'
