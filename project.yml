name: Dashboard 2026
options:
  bundleIdPrefix: com.saikambampati
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  Dashboard 2026:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Web
        type: folder
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Dashboard 2026
        CFBundleIdentifier: com.saikambampati.dashboard2026
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSContactsUsageDescription: Show contacts you search for in the Address Book widget.
        NSAppleEventsUsageDescription: Control playback in Music from the Music widget.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Dashboard Widget
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            CFBundleTypeExtensions: [dashboardwidget]
    entitlements:
      path: Resources/Dashboard.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saikambampati.dashboard2026
        PRODUCT_NAME: Dashboard 2026
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Dashboard-Bridging-Header.h
schemes:
  Dashboard 2026:
    build:
      targets:
        Dashboard 2026: all
    run:
      config: Debug
